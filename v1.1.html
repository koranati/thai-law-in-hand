<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>กฎหมายในมือ v1.1</title><style>body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f7f9fc;color:#172033}.w{max-width:900px;margin:auto;padding:20px}header{background:#174ea6;color:white;padding:28px 0}input,textarea{width:100%;box-sizing:border-box;padding:14px;border:1px solid #dbe2ea;border-radius:12px;font:inherit}button{margin-top:9px;padding:11px 16px;border:0;border-radius:10px;background:#174ea6;color:white;font-weight:700}.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:16px;margin:12px 0}.muted{color:#64748b;line-height:1.6}.ai{margin-top:28px;background:#111827;color:white;border-radius:18px;padding:20px}.ai .muted{color:#cbd5e1}a{color:#174ea6}</style></head><body><header><div class="w"><h1>⚖️ กฎหมายในมือ <small>v1.1</small></h1><p>ค้นกฎหมายไทยด้วยภาษาที่ประชาชนใช้จริง</p></div></header><main class="w"><h2>ค้นหาหัวข้อกฎหมาย</h2><input id="q" placeholder="เช่น เลิกจ้าง คอนโด หมิ่นประมาท ผู้บริโภค"><button onclick="find()">ค้นหา</button><div id="r"></div><section class="ai"><h2>AI Mode • วิเคราะห์ประเด็นเบื้องต้น</h2><p class="muted">ระบบจับคู่กับฐานความรู้ที่มีอยู่เท่านั้น และไม่สร้างเลขมาตราขึ้นเอง</p><textarea id="p" rows="4" placeholder="เล่าเหตุการณ์ที่เกิดขึ้น..."></textarea><button onclick="ask()">วิเคราะห์</button><div id="a" class="muted"></div></section><p class="muted">ⓘ ข้อมูลเป็นความรู้เบื้องต้น ไม่ใช่คำปรึกษาเฉพาะคดี ควรตรวจตัวบทฉบับปัจจุบันจากแหล่งทางการ</p></main><script>let laws=[];fetch('data/laws.json').then(x=>x.json()).then(x=>{laws=x;show(x)});function e(s){return String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function show(x){r.innerHTML=x.length?x.map(y=>`<div class="card"><b>${e(y.title)}</b><div class="muted">${e(y.law)}</div><p>${e(y.summary)}</p><a href="${y.official}" target="_blank">ตรวจสอบแหล่งทางการ ↗</a></div>`).join(''):'<div class="card">ไม่พบข้อมูลที่ตรงกัน</div>'}function find(){let s=q.value.toLowerCase();show(laws.filter(x=>[x.title,x.law,x.summary,...x.keywords].join(' ').toLowerCase().includes(s)))}function ask(){let s=p.value.toLowerCase();let h=laws.map(x=>({x,n:x.keywords.filter(k=>s.includes(k.toLowerCase())).length})).filter(z=>z.n).sort((a,b)=>b.n-a.n).map(z=>z.x).slice(0,4);a.innerHTML=h.length?'<h3>ประเด็นที่ควรตรวจสอบ</h3>'+h.map(x=>'• '+e(x.title)+' — '+e(x.law)).join('<br>'):'<br>ยังจับคู่กับฐานข้อมูลปัจจุบันไม่ได้ ระบบจะไม่เดามาตราที่ไม่มีข้อมูลรองรับ'}</script></body></html>
